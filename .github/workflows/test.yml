name: build, lint and test

on:
  push:
    branches:
      - main
  pull_request:

env:
  FOUNDRY_PROFILE: ci
  MAINNET_RPC_URL: ${{ vars.MAINNET_RPC_URL }}
  BASE_RPC_URL: ${{ vars.BASE_RPC_URL }}

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: true

    name: Foundry project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          fetch-depth: 2

      - uses: pnpm/action-setup@646cdf48217256a3d0b80361c5a50727664284f2 # v2.0.1
        with:
          version: 8

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1
        with:
          version: nightly

      - name: Setup Node.js environment
        uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3
        with:
          node-version: 18
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Pre-install solc
        run: forge build --root packages/splits-v2 --skip "test/**" "script/**" > /dev/null 2>&1

      - name: Build
        run: pnpm build:optimized

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test:optimized
